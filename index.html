<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Punarjanma: What Happens After Death?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@600;700&family=Noto+Serif+Devanagari:wght@500;600&family=Noto+Serif+Gujarati:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--maroon:#5a1a30;--deep:#3a0f20;--wine:#7a1f35;--gold:#d6a84e;--gold2:#b8862e;--cream:#f6eee0;--ink:#3a1220;
  --serif:'EB Garamond',Georgia,'Times New Roman',serif;--cap:'Cinzel','Trajan Pro',Georgia,serif;--sans:'Montserrat','Segoe UI',Arial,sans-serif;--deva:'Noto Serif Devanagari','Nirmala UI','Mangal',serif;--guj:'Noto Serif Gujarati','Nirmala UI','Shruti',serif}
html,body{width:100%;height:100%;overflow:hidden;background:#200810;font-family:var(--serif);color:var(--cream);user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;color:inherit}
#stage{position:absolute;left:50%;top:50%;overflow:hidden;
  background:radial-gradient(ellipse 70% 40% at 50% 0%,rgba(255,214,150,.22),rgba(255,214,150,0) 70%),
  repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 268px,rgba(0,0,0,.16) 268px 271px,rgba(255,255,255,.025) 271px 273px),
  linear-gradient(180deg,#5e1c33 0%,#4a1428 60%,#3a0f20 100%)}
#stage.portrait{width:1080px;height:1920px}
#stage.landscape{width:1920px;height:1080px}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .6s,visibility 0s .6s}
.screen.active{opacity:1;visibility:visible;transition:opacity .6s,visibility 0s}

/* type */
.cap{font-family:var(--cap);letter-spacing:.06em}
.gold{background:linear-gradient(180deg,#fbe6a8 0%,#e0b45a 45%,#a8741f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kicker{font-family:var(--sans);font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-size:24px}
.rule{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto}

/* buttons */
.btn{font-family:var(--sans);font-weight:700;font-size:28px;letter-spacing:.16em;text-transform:uppercase;padding:24px 46px;border-radius:999px;
  background:linear-gradient(180deg,#f3d48a,#d6a84e 55%,#b8862e);color:#3a0f20;box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .12s,filter .12s;white-space:nowrap}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn.line{background:rgba(246,238,224,.04);color:var(--cream);box-shadow:inset 0 0 0 2px rgba(214,168,78,.7)}
.btn.round{width:104px;height:104px;padding:0;display:grid;place-items:center;font-size:34px;letter-spacing:0}
.topbar{display:flex;align-items:center;gap:28px;flex:none}
.topbar .t{flex:1;min-width:0}
.topbar h2{font-family:var(--cap);font-weight:600;font-size:46px;line-height:1.1;letter-spacing:.06em}
.back{font-size:22px;padding:20px 32px 20px 26px;display:flex;align-items:center;gap:12px}.back::before{content:"";width:12px;height:12px;border-left:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg)}

/* medallion */
.medal{border-radius:50%;border:14px solid transparent;background:radial-gradient(circle at 50% 40%,#fffaf0,#efe2c8) padding-box,linear-gradient(140deg,#f8e2a0,#b8862e 35%,#f3d48a 60%,#9a6a1c) border-box;box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 0 0 3px rgba(184,134,46,.35)}

/* ATTRACT */
#attract{align-items:center;justify-content:space-between;padding:120px 60px 130px;cursor:pointer;text-align:center}
.headRow{display:flex;align-items:center;gap:22px;justify-content:center}
.numBadge{width:96px;height:96px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--cap);font-weight:700;font-size:56px;color:#3a0f20;background:radial-gradient(circle at 40% 35%,#f8e2a0,#d6a84e 60%,#a8741f);box-shadow:0 10px 24px rgba(0,0,0,.4)}
.bigTitle{font-family:var(--cap);font-weight:700;font-size:96px;line-height:1;letter-spacing:.03em;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.subTitle{font-family:var(--cap);font-weight:600;font-size:46px;letter-spacing:.05em;color:#fbf3e4;text-shadow:0 4px 10px rgba(0,0,0,.4);margin-top:26px}
#attractWheel{width:840px;height:840px;flex:none}
#attractWheel svg{width:100%;height:100%;display:block;filter:drop-shadow(0 30px 50px rgba(0,0,0,.45))}
.touch{display:flex;flex-direction:column;align-items:center;gap:26px}
.touch .btn{font-size:30px;padding:30px 72px;animation:glowPulse 2.6s ease-in-out infinite}
@keyframes glowPulse{0%,100%{box-shadow:0 8px 24px rgba(0,0,0,.35),0 0 0 0 rgba(214,168,78,.5)}50%{box-shadow:0 8px 24px rgba(0,0,0,.35),0 0 0 30px rgba(214,168,78,0)}}
.jsLine{font-family:var(--serif);font-style:italic;font-size:38px;color:#e9d6b4}
.landscape #attract{display:grid;grid-template-columns:840px 1fr;grid-template-rows:1fr 1fr;column-gap:80px;row-gap:60px;padding:60px 110px;align-items:center}
.landscape #attractWheel{grid-row:1/3;grid-column:1;width:840px;height:840px}
.landscape .aTitle{grid-column:2;align-self:end}
.landscape .touch{grid-column:2;align-self:start}
.deva{font-family:var(--deva);font-weight:500}

/* HOME */
#home{padding:90px 60px 60px;gap:44px}
.homeHead{text-align:center;display:flex;flex-direction:column;gap:20px;align-items:center;flex:none}
.headRow.small .numBadge{width:80px;height:80px;font-size:46px}
.homeHead h1{font-family:var(--cap);font-weight:700;font-size:80px;line-height:1;letter-spacing:.03em}
.homeHead p{font-size:40px;font-style:italic;color:#e9d6b4}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:1fr 1fr 1fr;gap:34px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:28px 30px;border-radius:28px;min-height:0;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.12));box-shadow:inset 0 0 0 2px rgba(214,168,78,.55),0 20px 40px rgba(0,0,0,.3);transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile .ic{width:190px;height:190px;flex:none;border-width:9px;overflow:hidden}
.tile .ic svg{width:100%;height:100%;display:block}
.tile .num{font-family:var(--cap);font-weight:700;font-size:26px;color:var(--gold);letter-spacing:.08em}
.tile h3{font-family:var(--cap);font-weight:600;font-size:40px;line-height:1.1;color:#f3d48a;letter-spacing:.03em;margin-top:4px}
.tile p{font-size:31px;line-height:1.25;color:#ead9bd;margin-top:10px}
.tiles .tile{flex-direction:row;text-align:left;gap:48px;padding:30px 56px}
.tiles .tile .ic{width:270px;height:270px}
.tiles .tile h3{font-size:46px}.tiles .tile p{font-size:34px}
.landscape #home{padding:60px 60px 46px;gap:36px}
.landscape .tiles{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr;gap:40px}
.landscape .tiles .tile{flex-direction:column;text-align:center;padding:36px 40px;gap:28px}
.landscape .tiles .tile .ic{width:290px;height:290px}
.landscape .tiles .tile h3{font-size:44px}.landscape .tiles .tile p{font-size:32px}
.homeFoot{display:flex;align-items:center;justify-content:flex-end;gap:22px;flex:none}
.wheelNote{flex:1;display:flex;align-items:center;gap:22px;font-size:32px;line-height:1.3;color:#e9d6b4}
.wheelNote b{font-family:var(--cap);font-weight:600;color:#f3d48a;letter-spacing:.04em}

/* CYCLE */
#cycle{padding:60px;gap:34px}
.cmain{flex:1;display:flex;flex-direction:column;gap:34px;align-items:center;min-height:0}
.landscape .cmain{flex-direction:row;align-items:stretch;gap:60px}
#cycleWheel{width:900px;height:900px;flex:none}
.landscape #cycleWheel{width:820px;height:820px;align-self:center}
#cycleWheel svg{width:100%;height:100%;display:block}
.panel{flex:1;width:100%;min-height:0;border-radius:30px;padding:40px 50px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.28));box-shadow:inset 0 0 0 2px rgba(214,168,78,.5)}
.panel h3{font-family:var(--cap);font-weight:600;font-size:54px;color:#f3d48a;line-height:1.05}
.panel .body{font-size:40px;line-height:1.38}
.panel .verse{font-family:var(--deva);font-size:34px;line-height:1.6;color:#f3d48a;margin-top:auto;padding-top:18px;border-top:1px solid rgba(214,168,78,.35)}
.panel .nexthint{display:flex;align-items:center;gap:18px;font-size:34px;color:#fbf3e4;padding:16px 24px;border-radius:18px;background:rgba(214,168,78,.14);box-shadow:inset 0 0 0 2px rgba(214,168,78,.55);animation:hintIn .8s ease .4s both}
.panel .nexthint span{font-family:var(--sans);font-weight:700;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:#3a0f20;background:linear-gradient(180deg,#f3d48a,#d6a84e);padding:8px 16px;border-radius:999px}
.panel .nexthint b{color:#f3d48a;font-weight:600}
@keyframes hintIn{from{opacity:0;transform:translateX(-14px)}}
.btn.pulseBtn{animation:glowPulse 1.8s ease-in-out infinite}
svg .nextRing{animation:nring 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes nring{from{transform:scale(1);opacity:.9}to{transform:scale(1.22);opacity:0}}
.panel .src{font-family:var(--sans);font-weight:600;font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:#c9a96e}
.panel.swap>*{animation:rise .55s ease both}.panel.swap>*:nth-child(2){animation-delay:.06s}.panel.swap>*:nth-child(3){animation-delay:.12s}.panel.swap>*:nth-child(4){animation-delay:.2s}.panel.swap>*:nth-child(5){animation-delay:.26s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.crow{display:flex;gap:20px;flex:none;justify-content:center}.crow .btn{font-size:24px;padding:24px 36px}
.landscape .cside{flex:1;display:flex;flex-direction:column;gap:26px;min-width:0}
.portrait .cside{display:contents}
.hint{font-family:var(--serif);font-style:italic;font-size:32px;color:#c9b08a;text-align:center}

/* VERSES */
#verses{padding:60px;gap:30px}
#vCard{flex:1;border-radius:34px;padding:70px 80px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:32px;color:var(--ink);
  background:radial-gradient(ellipse at 50% 30%,#fffaf0,#efe2c8);box-shadow:0 30px 60px rgba(0,0,0,.4),inset 0 0 0 3px #d6a84e,inset 0 0 0 14px #fbf5e9,inset 0 0 0 16px rgba(184,134,46,.5)}
#vCard .src{font-family:var(--sans);font-weight:700;font-size:26px;letter-spacing:.24em;text-transform:uppercase;color:#9a6a1c}
#vCard .sk{font-family:var(--deva);font-weight:600;font-size:56px;line-height:1.7;color:#7a1f35}
#vCard .sk.gu{font-family:var(--guj)}
#vCard .dn{font-family:var(--deva);font-weight:500}
#vCard .tr{font-size:36px;line-height:1.45;font-style:italic;color:#9a6a1c;margin-top:-10px}
.landscape #vCard .tr{font-size:32px}
#vCard .en{font-size:52px;line-height:1.35;font-style:italic;color:#3a1220}
#vCard .rf{font-size:36px;line-height:1.4;color:#6a4a3a;max-width:860px}
#vCard .rf b{font-family:var(--sans);font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:#9a6a1c;display:block;margin-bottom:8px}
#vCard .orn{width:220px;height:20px}
.landscape #vCard{padding:50px 120px;gap:22px}
.landscape #vCard .sk{font-size:44px}.landscape #vCard .en{font-size:40px}.landscape #vCard .rf{font-size:30px;max-width:1300px}
#vCard.swapR{animation:swapR .55s ease}#vCard.swapL{animation:swapL .55s ease}
@keyframes swapR{from{opacity:0;transform:translateX(80px)}}@keyframes swapL{from{opacity:0;transform:translateX(-80px)}}
.nav{display:flex;align-items:center;gap:20px;flex:none}
.dots{flex:1;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 2px #d6a84e;transition:.3s}
.dots i.on{background:#d6a84e;transform:scale(1.3)}

/* KARMA & MOKSHA */
#karma{padding:60px;gap:30px}
.tabs{display:flex;gap:14px;flex:none;justify-content:center}
.tab{font-family:var(--sans);font-weight:700;font-size:22px;letter-spacing:.16em;text-transform:uppercase;padding:20px 30px;border-radius:999px;box-shadow:inset 0 0 0 2px rgba(214,168,78,.6);color:#e9d6b4}
.tab.on{background:linear-gradient(180deg,#f3d48a,#d6a84e 55%,#b8862e);color:#3a0f20;box-shadow:none}
.kmain{flex:1;display:flex;flex-direction:column;gap:30px;align-items:center;min-height:0}
.landscape .kmain{flex-direction:row;align-items:stretch;gap:60px}
#kViz{width:860px;height:860px;flex:none}
.landscape #kViz{width:780px;height:780px;align-self:center}
#kViz svg{width:100%;height:100%;display:block}
#kViz [data-k]{cursor:pointer}

/* ===== SVG animation library ===== */
svg text{font-family:'Cinzel',Georgia,serif}
svg .pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.1);opacity:.8}}
svg .breathe{animation:breathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe{50%{transform:scale(1.04)}}
svg .twinkle{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{opacity:.25}}
svg .fadeIn{animation:fadeIn 1.6s ease both}
@keyframes fadeIn{from{opacity:0}}
svg .fadeOut{animation:fadeOut 1.6s ease both}
@keyframes fadeOut{to{opacity:0}}
svg .fadeLow{animation:fadeLow 2.6s ease both}
@keyframes fadeLow{to{opacity:.16}}
svg .rise{animation:riseIn 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes riseIn{from{opacity:0;transform:translateY(40px)}}
svg .grow{animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes grow{from{opacity:0;transform:scale(.6)}}
svg .growC{animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}
svg .draw{stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
svg .spin{animation:spin 80s linear infinite;transform-box:fill-box;transform-origin:center}
svg .spinR{animation:spin 80s linear infinite reverse;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
svg .flow{animation:flow 4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-240}}
svg .walk{animation:walk 7s ease-in-out both}
@keyframes walk{to{transform:translateX(190px)}}
svg .sway{animation:sway 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(1.6deg)}}
svg .flicker{animation:flicker .3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flicker{to{transform:scale(.9,1.08)}}
svg .dim{animation:dim 3s ease forwards}
@keyframes dim{to{opacity:.1}}
svg .leap{animation:leap 3s ease-in-out both}
@keyframes leap{0%{transform:translate(0,0);opacity:0}10%{opacity:1}50%{transform:translate(300px,-150px)}90%{opacity:1}100%{transform:translate(620px,0);opacity:0}}
svg .bobW{animation:bobW 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bobW{0%,100%{transform:rotate(-4deg)}50%{transform:translateY(8px) rotate(4deg)}}
svg .ripple{animation:ripple 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{from{transform:scale(.4);opacity:.9}to{transform:scale(1.5);opacity:0}}
svg .sink{animation:sink 11s ease-in both}
@keyframes sink{to{transform:translateY(150px)}}
svg .sunrise{animation:sunrise 6s ease-out both}
@keyframes sunrise{from{transform:translateY(140px)}}
svg .flyR{animation:flyR 22s linear infinite}
@keyframes flyR{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
svg .flash{animation:flash 2s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes flash{0%{opacity:0;transform:scale(.4)}30%{opacity:1}100%{opacity:0;transform:scale(2)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe6a8"/><stop offset=".5" stop-color="#d6a84e"/><stop offset="1" stop-color="#a8741f"/></linearGradient>
<linearGradient id="gGoldH" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8e2a0"/><stop offset=".35" stop-color="#b8862e"/><stop offset=".6" stop-color="#f3d48a"/><stop offset="1" stop-color="#9a6a1c"/></linearGradient>
<radialGradient id="gCream" cx=".5" cy=".42" r=".65"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#ecdcbf"/></radialGradient>
<radialGradient id="gMaroon" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#8a2a45"/><stop offset="1" stop-color="#3a0f20"/></radialGradient>
<radialGradient id="gWine" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#9a2c48"/><stop offset="1" stop-color="#5a1428"/></radialGradient>
<linearGradient id="gDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e0b19"/><stop offset=".55" stop-color="#6e1f38"/><stop offset="1" stop-color="#c0703a"/></linearGradient>
<linearGradient id="gDawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf4e6"/><stop offset=".6" stop-color="#f4dcae"/><stop offset="1" stop-color="#e8b86e"/></linearGradient>
<radialGradient id="gHeaven" cx=".5" cy=".42" r=".7"><stop offset="0" stop-color="#fffdf5"/><stop offset=".5" stop-color="#f8e2a8"/><stop offset="1" stop-color="#d69a48"/></radialGradient>
<radialGradient id="gGlow"><stop offset="0" stop-color="#fff6d8"/><stop offset=".35" stop-color="#f3d48a" stop-opacity=".7"/><stop offset="1" stop-color="#d6a84e" stop-opacity="0"/></radialGradient>
<radialGradient id="gSunSoft"><stop offset="0" stop-color="#f6d58e" stop-opacity=".9"/><stop offset=".55" stop-color="#eebd6a" stop-opacity=".45"/><stop offset="1" stop-color="#e6a850" stop-opacity="0"/></radialGradient>
</defs></svg>

<div id="stage" class="portrait">

  <!-- ATTRACT -->
  <section id="attract" class="screen active">
    <div class="aTitle"><div class="headRow"><div class="numBadge">3</div><div class="bigTitle gold">PUNARJANMA</div></div><div class="subTitle">WHAT HAPPENS AFTER DEATH?</div></div>
    <div id="attractWheel"></div>
    <div class="touch"><div class="btn">Touch to Begin</div><div class="jsLine">Jay Swaminarayan</div></div>
  </section>

  <!-- HOME -->
  <section id="home" class="screen">
    <div class="homeHead">
      <div class="headRow small"><div class="numBadge">3</div><h1 class="gold">PUNARJANMA</h1></div>
      <p>Choose a section to begin.</p>
    </div>
    <div class="tiles" id="tiles"></div>
  </section>

  <!-- CYCLE -->
  <section id="cycle" class="screen">
    <div class="topbar"><button class="btn line back" data-go="home">Back</button><div class="t"><div class="kicker">3.1</div><h2 class="gold">The Cycle of Sansara</h2></div></div>
    <div class="cmain">
      <div id="cycleWheel"></div>
      <div class="cside">
        <div class="panel" id="cPanel"></div>
        <div class="crow"><button class="btn line" id="cPlay">Play the cycle</button><button class="btn" id="cMoksha">The way out: Moksha</button></div>
      </div>
    </div>
  </section>

  <!-- VERSES -->
  <section id="verses" class="screen">
    <div class="topbar"><button class="btn line back" data-go="home">Back</button><div class="t"><div class="kicker">3.2</div><h2 class="gold">Scriptures</h2></div></div>
    <div id="vCard"></div>
    <div class="nav"><button class="btn line round" id="vPrev" aria-label="Previous"><svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M16 4v16L5 12z"/></svg></button><div class="dots" id="vDots"></div><button class="btn round" id="vNext" aria-label="Next"><svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M8 4v16l11-8z"/></svg></button></div>
  </section>

  <!-- KARMA & MOKSHA -->
  <section id="karma" class="screen">
    <div class="topbar"><button class="btn line back" data-go="home">Back</button><div class="t"><div class="kicker">3.3</div><h2 class="gold">Karma and Moksha</h2></div></div>

    <div class="kmain">
      <div id="kViz"></div>

</div>

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const S={idleT:null};
const IDLE_MS=90000; // back to the welcome screen after 90 s without a touch
const M='#7a1f35',CR='#f6eee0',GD='url(#gGold)';

/* ================= pictogram library (exhibit style) ================= */
function atma(x,y,s=1,cls='',glow=true){return `<g transform="translate(${x} ${y}) scale(${s})"><g class="${cls}">${glow?'<circle r="120" fill="url(#gGlow)" class="pulse"/>':''}<path d="M0 -70 C 14 -44, 46 -26, 46 8 C 46 36, 25 52, 0 52 C -25 52, -46 36, -46 8 C -46 -26, -14 -44, 0 -70Z" fill="url(#gGold)"/><path d="M0 -30 C 7 -16, 22 -6, 22 12 C 22 26, 12 34, 0 34 C -12 34, -22 26, -22 12 C -22 -6, -7 -16, 0 -30Z" fill="#fff8ea"/></g></g>`}
function pPerson(x,y,s=1,c=M,cls=''){return `<g transform="translate(${x} ${y}) scale(${s})"><g class="${cls}" fill="${c}"><circle cx="0" cy="-200" r="26"/><rect x="-31" y="-168" width="62" height="94" rx="16"/><rect x="-48" y="-166" width="15" height="84" rx="7.5"/><rect x="33" y="-166" width="15" height="84" rx="7.5"/><rect x="-28" y="-84" width="25" height="84" rx="11"/><rect x="3" y="-84" width="25" height="84" rx="11"/></g></g>`}
function pElder(x,y,s=1,c=M,cls=''){return `<g transform="translate(${x} ${y}) scale(${s})"><g class="${cls}" fill="${c}"><circle cx="20" cy="-184" r="25"/><rect x="-28" y="-160" width="56" height="88" rx="16" transform="rotate(14 0 -116)"/><rect x="18" y="-150" width="15" height="70" rx="7.5" transform="rotate(-28 25 -150)"/><line x1="58" y1="-96" x2="68" y2="0" stroke="${c}" stroke-width="10" stroke-linecap="round"/><rect x="-26" y="-82" width="24" height="82" rx="10"/><rect x="2" y="-82" width="24" height="82" rx="10" transform="rotate(-6 14 -82)"/></g></g>`}
function pBaby(x,y,s=1,c=M,cls=''){return `<g transform="translate(${x} ${y}) scale(${s})"><g class="${cls}"><g fill="${c}"><circle cx="0" cy="-60" r="27"/><rect x="-32" y="-30" width="64" height="100" rx="32"/></g><path d="M-30 4 L30 -12 M-30 34 L30 18" stroke="${CR}" stroke-width="5" opacity=".8"/></g></g>`}
function pRobed(x,y,s=1,c=M,o={}){const crown=o.crown?`<g class="${o.crownCls||''}" style="${o.crownStyle||''}"><path d="M-30 -222 L-34 -252 L-16 -236 L0 -260 L16 -236 L34 -252 L30 -222Z" fill="${o.crownC||GD}"/></g>`:`<circle cx="0" cy="-238" r="11" fill="${c}"/>`;
  return `<g transform="translate(${x} ${y}) scale(${s})"><g class="${o.cls||''}">${o.halo?`<circle cx="0" cy="-210" r="70" fill="url(#gGlow)" class="pulse"/>`:''}<g fill="${c}"><circle cx="0" cy="-210" r="27"/><path d="M-17 -196 Q0 -158 17 -196Z"/><path d="M-36 -178 Q0 -190 36 -178 L60 0 L-60 0Z"/><rect x="-54" y="-170" width="16" height="96" rx="8" transform="rotate(6 -46 -170)"/><rect x="38" y="-170" width="16" height="96" rx="8" transform="rotate(-6 46 -170)"/></g>${crown}</g></g>`}
function pSeated(x,y,s=1,c=M,o={}){return `<g transform="translate(${x} ${y}) scale(${s})"><g class="${o.cls||''}">${o.halo?`<circle cx="0" cy="-120" r="150" fill="url(#gGlow)" class="pulse"/>`:''}<g fill="${c}"><circle cx="0" cy="-158" r="26"/><circle cx="0" cy="-186" r="10"/><path d="M-16 -144 Q0 -112 16 -144Z"/><path d="M-36 -128 Q0 -140 36 -128 L48 -40 L-48 -40Z"/><ellipse cx="0" cy="-26" rx="88" ry="28"/><rect x="-56" y="-118" width="16" height="72" rx="8" transform="rotate(-14 -48 -118)"/><rect x="40" y="-118" width="16" height="72" rx="8" transform="rotate(14 48 -118)"/></g></g></g>`}
function deerSil(x,y,s=1,c=M,o={}){let g=`<g fill="${c}"><ellipse cx="0" cy="-112" rx="88" ry="38"/><path d="M48 -132 L86 -206 L112 -196 L82 -110Z"/><ellipse cx="110" cy="-206" rx="34" ry="19" transform="rotate(22 110 -206)"/><ellipse cx="90" cy="-232" rx="7" ry="22" transform="rotate(-25 90 -232)"/><ellipse cx="108" cy="-236" rx="7" ry="22" transform="rotate(15 108 -236)"/><ellipse cx="-90" cy="-128" rx="12" ry="8" transform="rotate(-30 -90 -128)"/>`;
  [[-62,-4],[-42,6],[46,-6],[66,4]].forEach(([lx,r])=>{g+=`<rect x="${lx-5}" y="-102" width="10" height="104" rx="5" transform="rotate(${r} ${lx} -102)"/>`});g+='</g>';
  if(o.fawn)g+=[[-40,-120],[-10,-130],[20,-118],[-58,-104],[42,-128]].map(([a,b])=>`<circle cx="${a}" cy="${b}" r="6" fill="${CR}" opacity=".85"/>`).join('');
  if(o.glow)g+=atma(10,-112,.3,'',true);
  return `<g transform="translate(${x} ${y}) scale(${o.flip?-s:s} ${s})"><g class="${o.cls||''}">${g}</g></g>`}
function tree(x,y,s=1,c=M){return `<g transform="translate(${x} ${y}) scale(${s})"><g class="sway" fill="${c}"><rect x="-9" y="-130" width="18" height="130" rx="4"/><circle cx="0" cy="-185" r="62"/><circle cx="-48" cy="-145" r="44"/><circle cx="48" cy="-145" r="44"/></g></g>`}
function hut(x,y,s=1,c=M){return `<g transform="translate(${x} ${y}) scale(${s})"><g fill="${c}"><rect x="-80" y="-92" width="160" height="92"/><path d="M-112 -84 L0 -176 L112 -84Z"/></g><rect x="-20" y="-60" width="40" height="60" rx="20" fill="${CR}" opacity=".85"/></g>`}
function palace(x,y,s=1,c=M){return `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><rect x="-150" y="-200" width="300" height="200"/>${[-100,-50,0,50,100].map(a=>`<path d="M${a-16} 0 V-100 Q${a} -126 ${a+16} -100 V0Z" fill="${CR}" opacity=".7"/>`).join('')}<path d="M-64 -200 Q-64 -290 0 -322 Q64 -290 64 -200Z"/><path d="M-150 -200 Q-150 -250 -114 -266 Q-78 -250 -78 -200Z"/><path d="M78 -200 Q78 -250 114 -266 Q150 -250 150 -200Z"/><rect x="-2" y="-380" width="4" height="60"/><path d="M2 -380 L44 -366 L2 -352Z" fill="url(#gGold)"/></g>`}
function temple(x,y,s=1,c=GD,stroke='#a8741f'){const dome=(cx,b,w,h)=>`<path d="M${cx-w/2} ${b} Q${cx-w/2} ${b-h*.7} ${cx} ${b-h} Q${cx+w/2} ${b-h*.7} ${cx+w/2} ${b}Z"/><circle cx="${cx}" cy="${b-h-8}" r="${w*.07}"/>`;
  let arches='';for(let i=-2;i<=2;i++)arches+=`<path d="M${i*90-26} -80 V-176 Q${i*90} -218 ${i*90+26} -176 V-80Z" fill="#fff8ea" opacity="${i===0?1:.75}"/>`;
  return `<g transform="translate(${x} ${y}) scale(${s})"><g fill="${c}" stroke="${stroke}" stroke-width="3"><rect x="-300" y="-46" width="600" height="46" rx="6"/><rect x="-262" y="-80" width="524" height="36" rx="5"/><rect x="-230" y="-272" width="460" height="194"/><rect x="-246" y="-294" width="492" height="24" rx="4"/>${dome(0,-294,170,230)}${dome(-170,-294,110,140)}${dome(170,-294,110,140)}</g>${arches}<rect x="-2" y="-600" width="4" height="70" fill="${stroke}"/><path d="M2 -600 L54 -584 L2 -568Z" fill="#c0503a"/></g>`}
function kurta(x,y,s=1,c=M,o={}){const d='M-40 -100 L-15 -110 Q0 -94 15 -110 L40 -100 L96 -60 L80 -18 L56 -36 L56 100 L-56 100 L-56 -36 L-80 -18 L-96 -60Z';
  return `<g transform="translate(${x} ${y}) scale(${s})"><g class="${o.cls||''}" style="${o.style||''}"><path d="${d}" fill="${c}" ${o.worn?`stroke="#9a6a50" stroke-width="3" stroke-dasharray="10 8"`:''}/><path d="M0 -96 V10" stroke="${CR}" stroke-width="4" opacity=".6"/>${o.worn?`<path d="M-56 70 l14 -12 l10 14 l12 -14 l10 14 M30 -40 l16 10 l-6 14" stroke="${CR}" stroke-width="4" fill="none"/><rect x="-40" y="-10" width="30" height="26" fill="#c9a07a" stroke="#9a6a50" stroke-dasharray="4 4" transform="rotate(-10 -25 3)"/>`:''}</g></g>`}
function diya(x,y,s=1,cls=''){return `<g transform="translate(${x} ${y}) scale(${s})"><g class="${cls}"><circle cy="-30" r="44" fill="url(#gGlow)"/><path class="flicker" d="M0 -6 C 12 -20 9 -38 0 -58 C -9 -38 -12 -20 0 -6Z" fill="#f3c25e"/></g><path d="M-42 -4 Q0 32 42 -4Z" fill="${M}"/></g>`}
function birdsV(y,d=0,c=M){return `<g class="flyR" style="animation-delay:-${d}s">${[[0,0],[56,-26],[104,10]].map(([a,b])=>`<path d="M${a} ${y+b} q12 -12 24 0 q12 -12 24 0" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/>`).join('')}</g>`}
function fish(x,y,s=1,c=M){return `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><path d="M-40 0 Q-10 -26 26 0 Q-10 26 -40 0Z"/><path d="M22 0 L46 -18 L46 18Z"/></g>`}
function bird(x,y,s=1,c=M){return `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><ellipse rx="34" ry="18"/><circle cx="30" cy="-14" r="14"/><path d="M42 -16 L58 -10 L42 -6Z"/><path d="M-8 -6 Q-30 -46 10 -30Z"/><path d="M-30 4 L-56 -4 L-50 14Z"/></g>`}
function insect(x,y,s=1,c=M){return `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><ellipse cx="-22" rx="22" ry="15"/><circle cx="8" r="12"/><circle cx="28" r="10"/><path d="M-30 10 l-10 18 M-14 12 l0 20 M2 10 l8 18 M32 -8 l10 -18 M26 -8 l-2 -20" stroke="${c}" stroke-width="4" fill="none"/></g>`}
function plant(x,y,s=1,c=M){return `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><rect x="-4" y="-60" width="8" height="60"/><ellipse cx="-22" cy="-40" rx="22" ry="9" transform="rotate(-30 -22 -40)"/><ellipse cx="22" cy="-52" rx="22" ry="9" transform="rotate(30 22 -52)"/><circle cx="0" cy="-70" r="14"/></g>`}
function sunDisc(x,y,r,c='url(#gSunSoft)',cls=''){return `<g class="${cls}"><circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/></g>`}
const bgCream=()=>`<rect width="1000" height="1000" fill="url(#gCream)"/><g fill="none" stroke="#d6b77a" opacity=".35"><circle cx="500" cy="500" r="430" stroke-width="2"/><circle cx="500" cy="500" r="445" stroke-width="1"/></g>`;
const bgMaroon=()=>`<rect width="1000" height="1000" fill="url(#gMaroon)"/>`;
const ground=(y=760,c='#b8925a')=>`<rect x="0" y="${y}" width="1000" height="${1000-y}" fill="#e6d5b5" opacity=".55"/><line x1="90" y1="${y}" x2="910" y2="${y}" stroke="${c}" stroke-width="3"/>`;
const river=(y1,y2)=>`<rect x="0" y="${y1}" width="1000" height="${y2-y1}" fill="#cfd9d2" opacity=".55"/>`+[.3,.65].map(f=>`<path d="M-100 ${y1+(y2-y1)*f} q60 -10 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0" stroke="#8aa69a" stroke-width="4" fill="none" stroke-dasharray="60 60" class="flow"/>`).join('');
const lbl=(x,y,t,d=0,fs=30,c='#7a1f35')=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${fs}" fill="${c}" letter-spacing="4" class="fadeIn" style="animation-delay:${d}s">${t}</text>`;
function flyAtma(path,begin,dur,s=.4,fadeAt=null){return `<g opacity="0"><set attributeName="opacity" to="1" begin="${begin}s" fill="freeze"/>${fadeAt!=null?`<animate attributeName="opacity" from="1" to="0" begin="${fadeAt}s" dur=".8s" fill="freeze"/>`:''}<animateMotion path="${path}" begin="${begin}s" dur="${dur}s" fill="freeze" calcMode="spline" keyTimes="0;1" keyPoints="0;1" keySplines=".45 0 .3 1"/>${atma(0,0,s)}</g>`}
function rays(n,len,w,c='#f3d48a',op=.25){let d='';for(let i=0;i<n;i++){const a=i/n*Math.PI*2,b=a+w;d+=`M0 0 L${(Math.cos(a)*len).toFixed(0)} ${(Math.sin(a)*len).toFixed(0)} L${(Math.cos(b)*len).toFixed(0)} ${(Math.sin(b)*len).toFixed(0)}Z `}return `<path d="${d}" fill="${c}" opacity="${op}"/>`}

/* ================= CYCLE (interactive wheel) ================= */
const STATIONS=[
 {k:'birth',name:'Birth',ang:-90,title:'Birth',body:'The atma enters a new body. The family, abilities and tendencies it receives are shaped by the karmas it carries from before.',verse:'जातस्य हि ध्रुवो मृत्युर्ध्रुवं जन्म मृतस्य च।',src:'Bhagavad Gita 2.27'},
 {k:'life',name:'Life',ang:0,title:'Life',body:'In each life the atma acts, and every action leaves an impression (sanskar). These karmas ripen in this life or in lives to come.',verse:'यं यं वापि स्मरन्भावं त्यजत्यन्ते कलेवरम्।',src:'Bhagavad Gita 8.6'},
 {k:'old',name:'Old Age',ang:90,title:'Old Age',body:'The body ages and weakens; the atma does not. As childhood gave way to youth and youth to old age, so the atma will pass into another body.',verse:'देहिनोऽस्मिन्यथा देहे कौमारं यौवनं जरा।',src:'Bhagavad Gita 2.13'},
 {k:'death',name:'Death',ang:180,title:'Death',body:'The atma leaves the worn-out body as one sets aside old clothes. Death changes the body; it does not end the atma.',verse:'वासांसि जीर्णानि यथा विहाय नवानि गृह्णाति नरोऽपराणि।',src:'Bhagavad Gita 2.22'}
];
const ATMA_INFO={title:'The Atma',body:'At the center of the cycle is the atma: unborn, eternal and unchanging. It is never destroyed when the body is destroyed. Every birth and death happens to the body, not to the self.',verse:'न जायते म्रियते वा कदाचिन्…',src:'Bhagavad Gita 2.20'};
const MOKSHA_INFO={title:'Moksha',body:'The cycle need not go on forever. By becoming brahmarup through the Aksharbrahman Guru and offering bhakti to Parabrahman, the jiva rises above maya. It attains Akshardham and is never born again.',verse:'यद्गत्वा न निवर्तन्ते तद्धाम परमं मम॥',src:'Bhagavad Gita 15.6 · Satsang Diksha 116'};
const CY={ang:-90,target:-90,raf:0,auto:null,cur:null};
function cycleSVG(){const r=330;const P=a=>[500+Math.cos(a*Math.PI/180)*r,500+Math.sin(a*Math.PI/180)*r];
  const icons={birth:(x,y)=>pBaby(x,y+18,.62),life:(x,y)=>pPerson(x,y+66,.55),old:(x,y)=>pElder(x-8,y+66,.55),death:(x,y)=>`<g transform="translate(${x} ${y+16})" fill="${M}"><path d="M-46 0 A46 46 0 0 1 46 0Z"/>${[-60,-30,0,30,60].map(a=>`<rect x="-3" y="-80" width="6" height="22" rx="3" transform="rotate(${a})"/>`).join('')}<rect x="-62" y="10" width="124" height="6" rx="3"/><rect x="-44" y="24" width="88" height="6" rx="3"/></g>`};
  let arcs='';for(let i=0;i<4;i++){const a0=STATIONS[i].ang+24,a1=STATIONS[i].ang+66;const [x0,y0]=P(a0),[x1,y1]=P(a1);arcs+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="#b8925a" stroke-width="3"/>`;const t=(a1)*Math.PI/180;arcs+=`<path d="M0 -9 L16 0 L0 9Z" fill="#b8925a" transform="translate(${x1.toFixed(1)} ${y1.toFixed(1)}) rotate(${a1+90})"/>`}
  return `<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" id="cw">
  <circle cx="500" cy="500" r="486" fill="url(#gGoldH)"/><circle cx="500" cy="500" r="470" fill="url(#gCream)"/><circle cx="500" cy="500" r="455" fill="none" stroke="#d6b77a" stroke-width="2"/>
  <g id="mBeam" pointer-events="none" opacity="0" style="transition:opacity 1s"><path d="M440 500 L560 500 L640 0 L360 0Z" fill="url(#gGlow)"/></g>
  ${arcs}
  <path id="cArcA" d="M${P(-70)[0].toFixed(1)} ${P(-70)[1].toFixed(1)} A${r+44} ${r+44} 0 0 1 ${(500+Math.cos(-20*Math.PI/180)*(r+44)).toFixed(1)} ${(500+Math.sin(-20*Math.PI/180)*(r+44)).toFixed(1)}" fill="none"/>
  <path id="cArcB" d="M${(500+Math.cos(160*Math.PI/180)*(r+20)).toFixed(1)} ${(500+Math.sin(160*Math.PI/180)*(r+20)).toFixed(1)} A${r+20} ${r+20} 0 0 0 ${(500+Math.cos(110*Math.PI/180)*(r+20)).toFixed(1)} ${(500+Math.sin(110*Math.PI/180)*(r+20)).toFixed(1)}" fill="none"/>
  <text font-size="24" fill="#9a6a1c" style="font-family:var(--serif);font-style:italic"><textPath href="#cArcA" startOffset="50%" text-anchor="middle">Karma shapes the journey</textPath></text>
  <text font-size="24" fill="#9a6a1c" style="font-family:var(--serif);font-style:italic"><textPath href="#cArcB" startOffset="50%" text-anchor="middle">The body changes</textPath></text>
  ${STATIONS.map((s,i)=>{const [x,y]=P(s.ang);const bx=x+(x-500)*.0+76,by=y-76;return `<g class="hint" data-h="${i}" pointer-events="none" style="display:none"><circle cx="${x}" cy="${y}" r="118" fill="none" stroke="#d6a84e" stroke-width="6"/><circle cx="${x}" cy="${y}" r="118" fill="none" stroke="#d6a84e" stroke-width="5" class="nextRing"/></g><g data-st="${i}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="108" fill="#fffaf0" class="stBg" stroke="#e5d2a8" stroke-width="3"/><circle cx="${bx}" cy="${by}" r="25" fill="url(#gWine)" stroke="#d6a84e" stroke-width="3"/><text x="${bx}" y="${by+9}" text-anchor="middle" font-size="26" fill="#f3d48a" font-weight="700">${i+1}</text>${icons[s.k](x,y-22)}<text x="${x}" y="${y+64}" text-anchor="middle" font-size="22" fill="#3a1220" letter-spacing="3" font-weight="600">${s.name.toUpperCase()}</text></g>`}).join('')}
  <g data-st="atma" style="cursor:pointer"><circle cx="500" cy="500" r="152" fill="url(#gWine)" stroke="url(#gGoldH)" stroke-width="8"/>${atma(500,488,.95,'breathe',false)}<text x="500" y="590" text-anchor="middle" font-size="30" fill="#f3d48a" letter-spacing="6" font-weight="700">ATMA</text></g>
  <g id="traveller" pointer-events="none">${atma(0,0,.3)}</g>
  </svg>`}
function setHint(i){document.querySelectorAll('#cw .hint').forEach(h=>h.style.display=(+h.dataset.h===i)?'':'none');const m=$('#cMoksha');if(m)m.classList.toggle('pulseBtn',i==='moksha')}
function nextText(i){return i<3?`Tap <b>${STATIONS[i+1].name}</b> on the wheel`:'Tap <b>The way out: Moksha</b> below'}
function cyclePos(){const t=$('#traveller');if(!t)return;const a=CY.ang*Math.PI/180;t.setAttribute('transform',`translate(${(500+Math.cos(a)*330).toFixed(1)} ${(500+Math.sin(a)*330).toFixed(1)})`)}
function cycleAnim(){const d=CY.target-CY.ang;if(Math.abs(d)<.3){CY.ang=CY.target;cyclePos();CY.raf=0;return}CY.ang+=d*.07+Math.sign(d)*.2;cyclePos();CY.raf=requestAnimationFrame(cycleAnim)}
function panel(el,o,kick,next){el.innerHTML=`<div class="kicker">${kick}</div><h3>${o.title}</h3><div class="body">${o.body}</div>${next?`<div class="nexthint"><span>Next</span>${next}</div>`:''}<div class="verse">${o.verse}</div><div class="src">${o.src}</div>`;el.classList.remove('swap');void el.offsetWidth;el.classList.add('swap')}
function cycleGo(i,fromAuto){if(!fromAuto)cycleStop();$('#mBeam').setAttribute('opacity','0');$('#traveller').style.transition='';$('#traveller').style.opacity=1;
  document.querySelectorAll('#cw .stBg').forEach((c,j)=>{c.setAttribute('fill',j===i?'#f8e2a0':'#fffaf0');c.setAttribute('stroke',j===i?'#b8862e':'#e5d2a8')});
  if(i==='atma'){panel($('#cPanel'),ATMA_INFO,'At the center',CY.cur==null?'Tap <b>Birth</b> on the wheel':nextText(CY.cur));return}
  const s=STATIONS[i];let tgt=s.ang;while(tgt<CY.ang-1)tgt+=360;CY.target=tgt;if(!CY.raf)CY.raf=requestAnimationFrame(cycleAnim);
  panel($('#cPanel'),s,`Stage ${i+1} of 4`,nextText(i));CY.cur=i;setHint(i<3?i+1:'moksha')}
function cyclePlay(){if(CY.auto){cycleStop();return}$('#cPlay').textContent='Pause';let i=CY.cur==null?0:(CY.cur+1)%4;cycleGo(i,true);CY.auto=setInterval(()=>{i=(i+1)%4;cycleGo(i,true);resetIdle()},6500)}
function cycleStop(){clearInterval(CY.auto);CY.auto=null;const b=$('#cPlay');if(b)b.textContent='Play the cycle'}
function cycleMoksha(){cycleStop();document.querySelectorAll('#cw .stBg').forEach(c=>{c.setAttribute('fill','#fffaf0');c.setAttribute('stroke','#e5d2a8')});
  const t=$('#traveller');$('#mBeam').setAttribute('opacity','1');const a=CY.ang*Math.PI/180;const x0=500+Math.cos(a)*330,y0=500+Math.sin(a)*330;const t0=performance.now();
  const f=now=>{const p=Math.min(1,(now-t0)/2600),e=1-Math.pow(1-p,3);const x=x0+(500-x0)*e,y=y0+(40-y0)*e;t.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${1+e*.8})`);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f);
  panel($('#cPanel'),MOKSHA_INFO,'The way out','Tap <b>Birth</b> to go around again');CY.cur=null;CY.ang=-90;CY.target=-90;setHint(0)}
function cycleOpen(){cycleStop();$('#cycleWheel').innerHTML=cycleSVG();CY.ang=-90;CY.target=-90;CY.cur=null;cyclePos();panel($('#cPanel'),{title:'Birth, Life, Old Age, Death',body:'Go around the wheel in order, from 1 to 4, to see what the shastras teach about each stage. Then see the way out of the cycle.',verse:'जातस्य हि ध्रुवो मृत्युर्ध्रुवं जन्म मृतस्य च।',src:'Bhagavad Gita 2.27'},'Sansara','Tap <b>Birth</b> on the wheel to begin');setHint(0)}

/* ================= VERSES ================= */

let V=0;const ORN=`<svg class="orn" viewBox="0 0 220 20"><line x1="0" y1="10" x2="90" y2="10" stroke="#b8862e" stroke-width="1.5"/><path d="M110 2 L118 10 L110 18 L102 10Z" fill="#d6a84e"/><line x1="130" y1="10" x2="220" y2="10" stroke="#b8862e" stroke-width="1.5"/></svg>`;
function renderVerse(dir=1){const v=VERSES[V],c=$('#vCard');
  c.innerHTML=`<div class="src">${v.src}</div>${v.sk?`<div class="sk${v.gu?' gu':''}">${v.sk}</div>`:''}${v.tr?`<div class="tr">${v.tr}</div>`:''}${ORN}<div class="en">“${v.en}”</div><div class="rf">${v.rf}</div>`;
  c.classList.remove('swapR','swapL');void c.offsetWidth;c.classList.add(dir>0?'swapR':'swapL');
  $('#vDots').innerHTML=VERSES.map((_,i)=>`<i class="${i===V?'on':''}"></i>`).join('')}
function verseStep(d){V=(V+d+VERSES.length)%VERSES.length;renderVerse(d)}

/* ================= KARMA & MOKSHA ================= */

let KT=0;
function kTab(t){KT=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',+b.dataset.tab===t));$('#kViz').innerHTML=KTABS[t].svg();panel($('#kPanel'),KTABS[t].intro,['Karma','Forms of life','Akshar-Purushottam Darshan'][t])}
function kPick(i){const t=KTABS[KT];document.querySelectorAll('#kViz [data-k] .kBg').forEach((e,j)=>{e.style.filter=j===i?'brightness(1.12) drop-shadow(0 0 12px rgba(214,168,78,.9))':'';e.setAttribute('stroke-width',j===i?8:4)});
  panel($('#kPanel'),t.items[i],t.intro.title);}

/* ================= screens, layout, idle ================= */
const stage=$('#stage');let current='attract';
function fit(){const land=innerWidth>innerHeight*1.05;stage.className=land?'landscape':'portrait';const W=land?1920:1080,H=land?1080:1920;stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/W,innerHeight/H)})`}
function show(id){if(current==='cycle')cycleStop();
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));current=id;
  if(id==='cycle')cycleOpen();if(id==='verses'){V=0;renderVerse()}if(id==='karma')kTab(0);
  resetIdle()}
function resetIdle(){clearTimeout(S.idleT);S.idleT=setTimeout(()=>{if(current!=='attract')show('attract')},IDLE_MS)}

function build(){
  const icons={
   cycle:`<svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="104" fill="none" stroke="#b8925a" stroke-width="3"/>${[[-90,'b'],[0,'p'],[90,'e'],[180,'s']].map(([a,t])=>{const x=150+Math.cos(a*Math.PI/180)*104,y=150+Math.sin(a*Math.PI/180)*104;return `<circle cx="${x}" cy="${y}" r="30" fill="#fffaf0" stroke="#d6a84e" stroke-width="2"/>${t==='b'?pBaby(x,y+6,.3):t==='p'?pPerson(x,y+30,.25):t==='e'?pElder(x-4,y+30,.25):`<g transform="translate(${x} ${y+6})" fill="${M}"><path d="M-16 0 A16 16 0 0 1 16 0Z"/><rect x="-20" y="4" width="40" height="3"/></g>`}`}).join('')}<circle cx="150" cy="150" r="52" fill="url(#gWine)"/>${atma(150,150,.42,'breathe',false)}</svg>`,
   verses:`<svg viewBox="0 0 300 300"><text x="150" y="168" text-anchor="middle" font-size="72" fill="#7a1f35" style="font-family:var(--deva)">ॐ</text><g stroke="#b8862e" stroke-width="2"><line x1="70" y1="200" x2="230" y2="200"/><line x1="90" y1="214" x2="210" y2="214"/><line x1="110" y1="228" x2="190" y2="228"/></g><text x="150" y="98" text-anchor="middle" font-size="22" fill="#9a6a1c" letter-spacing="4">SHASTRA</text></svg>`,
   karma:`<svg viewBox="0 0 300 300">${[[150,96],[96,190],[204,190]].map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="44" fill="${i===0?'url(#gWine)':'#fffaf0'}" stroke="#d6a84e" stroke-width="3"/>`).join('')}${atma(150,96,.32,'',false)}<path d="M130 130 L110 150 M170 130 L190 150 M140 190 L160 190" stroke="#7a1f35" stroke-width="3"/>${pPerson(96,212,.18)}${deerSil(196,214,.18)}</svg>`
};
  const T=[['cycle','3.1','The Cycle of Sansara','Birth, life, old age and death, and the way out of the cycle.'],['verses','3.2','Scriptures','Verses from the Bhagavad Gita and Satsang Diksha.'],['karma','3.3','Karma and Moksha','Three kinds of karma, 84 lakh forms and five eternal entities.']];
  $('#tiles').innerHTML=T.map(t=>`<button class="tile" data-go="${t[0]}"><div class="ic medal">${icons[t[0]]}</div><div><div class="num">${t[1]}</div><h3>${t[2]}</h3><p>${t[3]}</p></div></button>`).join('');
  // attract wheel
  $('#attractWheel').innerHTML=cycleSVG().replace('id="cw"','id="aw"').replace('id="traveller"','id="aTrav"').replace('id="mBeam"','id="aBeam"').replace(/id="cArc/g,'id="aArc').replace(/href="#cArc/g,'href="#aArc');
  
  let a=-90;const at=$('#aTrav');(function spinA(){a+=.35;const r=a*Math.PI/180;at.setAttribute('transform',`translate(${(500+Math.cos(r)*330).toFixed(1)} ${(500+Math.sin(r)*330).toFixed(1)})`);requestAnimationFrame(spinA)})();
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const g=e.target.closest('button[data-go]');if(g){show(g.dataset.go);return}
  const st=e.target.closest('#cw [data-st]');if(st){const v=st.dataset.st;cycleGo(v==='atma'?'atma':+v);return}
  const k=e.target.closest('#kViz [data-k]');if(k){kPick(+k.dataset.k);return}
  const tb=e.target.closest('.tab');if(tb){kTab(+tb.dataset.tab);return}
});
$('#attract').addEventListener('click',()=>{show('home')});
$('#cPlay').onclick=cyclePlay;$('#cMoksha').onclick=cycleMoksha;
$('#vPrev').onclick=()=>verseStep(-1);$('#vNext').onclick=()=>verseStep(1);
let sx=null;$('#vCard').addEventListener('pointerdown',e=>{sx=e.clientX});$('#vCard').addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>50)verseStep(dx<0?1:-1)});
document.addEventListener('pointerdown',resetIdle,true);
document.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('resize',fit);
build();fit();resetIdle();
</script>
</body>
</html>
